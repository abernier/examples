name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # dist/ is assembled locally (./sync.sh) and committed. The landing page
      # is generated here instead, so it never gets stale.
      - name: Generate dist/index.html
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -f dist/index.html ]; then
            echo "dist/index.html is committed — keeping it"
            exit 0
          fi
          {
            cat <<'HEAD'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>examples</title>
              <style>
                :root { color-scheme: dark; --bg: #111; --fg: #fafafa; --card: #1a1a1a; --muted: #a1a1a1; --border: #ffffff1a; }
                * { box-sizing: border-box; }
                body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem;
                  background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased;
                  font: 400 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
                .card { width: 100%; max-width: 28rem; padding: 1.5rem; background: var(--card);
                  border: 1px solid var(--border); border-radius: 0.75rem; }
                h1 { margin: 0; font-size: 1rem; font-weight: 600; }
                p { margin: 0.375rem 0 1.25rem; color: var(--muted); }
                ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.125rem; }
                a { display: block; padding: 0.5rem 0.75rem; margin: 0 -0.75rem; border-radius: 0.5rem;
                  color: inherit; text-decoration: none; font-weight: 500; }
                a:hover { background: #ffffff0f; }
                .empty { color: var(--muted); }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>examples</h1>
                <p>Static builds, served from this repo.</p>
                <ul>
          HEAD
            count=0
            for d in dist/*/; do
              name=$(basename "$d")
              printf '            <li><a href="%s/">%s</a></li>\n' "$name" "$name"
              count=$((count + 1))
            done
            [ "$count" -gt 0 ] || printf '            <li class="empty">no examples yet</li>\n'
            cat <<'FOOT'
                </ul>
              </div>
            </body>
          </html>
          FOOT
          } > dist/index.html
          echo "listed $(grep -c '<li>' dist/index.html || true) example(s)"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
