name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in sync with preview.sh. The image ships the browsers; the npm package
  # has to match them, hence the pin.
  PLAYWRIGHT_VERSION: 1.62.1
  # Vercel: https://examples-steel.vercel.app — token is a repo secret,
  # `gh secret set VERCEL_TOKEN`. Ids below aren't secret.
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: abernier
  VERCEL_PROJECT: examples

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Browsers + system deps already baked in — only the npm package to add.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Previews survive between runs, so only projects whose files changed get
      # re-screenshot (preview.mjs compares hashes in _previews/manifest.json).
      # The key never hits exactly when dist/ changed — restore-keys gets us the
      # latest one anyway, which is the point.
      - uses: actions/cache@v4
        with:
          path: dist/_previews
          key: previews-${{ hashFiles('dist/**') }}
          restore-keys: previews-

      # Screenshots each dist/<name>/ into dist/_previews/. preview.mjs serves
      # dist/ under /examples/ itself, so absolute base paths resolve exactly
      # like they will on Pages.
      - run: |
          npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          node .github/preview.mjs

      # Builds the gallery (src/home/, Vite) from those previews into
      # dist/index.html + dist/_home/. After the screenshots, on purpose.
      - run: ./build-home.sh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # Same dist/, second host. No-op until VERCEL_TOKEN is set, so a missing
      # secret can't break the Pages deploy. The check is in the shell on
      # purpose: a step-level `if: env.VERCEL_TOKEN != ''` reads the masked
      # value and skips even when the secret is there.
      - name: Deploy to Vercel
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN not set — skipping Vercel deploy"
            exit 0
          fi
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json
          npx --yes vercel@latest deploy --prebuilt --prod --yes \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT"
