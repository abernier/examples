name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Browsers + system deps already baked in — nothing to install.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Screenshots each dist/<name>/ into dist/_previews/ and writes dist/index.html.
      # It serves dist/ under /examples/ itself, so absolute base paths resolve
      # exactly like they will on Pages.
      - run: node .github/preview.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
